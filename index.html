                                        <span className="text-xs font-black text-brand-deep uppercase">Start Mission ➡️</span>
                                    </button>
                                );
                            })}
                        </div>
                    </div>
                </div>
            );
        };

        // =========================================================================
        // 10. STAGE 1: TOPIC MATERIAL & MODEL TEXT
        // =========================================================================
        const ScreenTopicMaterial = ({ world, onBack, onComplete }) => (
            <div className={`flex-1 p-4 md:p-8 ${world.themeBg} overflow-y-auto`}>
                <div className="max-w-4xl mx-auto">
                    <button onClick={onBack} className="btn-3d bg-white text-slate-700 border-2 border-slate-300 shadow-[0_4px_0_#cbd5e1] px-4 py-2 text-sm mb-4">
                        ⬅️ Back to {world.name}
                    </button>

                    <div className="game-card p-6 md:p-8 animate-pop space-y-6">
                        <div className="text-center">
                            <span className={`inline-block text-xs font-black px-3 py-1 rounded-full border mb-2 ${world.badgeColor}`}>
                                {world.subtitle}
                            </span>
                            <h2 className="text-3xl font-black text-brand-deep">Look at the Picture: {world.subjectTitle}</h2>
                        </div>

                        <div className="max-w-md mx-auto">
                            <TopicIllustration topicId={world.id} className="w-full h-56 rounded-2xl shadow-md border-4 border-slate-100" />
                        </div>

                        <div className={`grid grid-cols-1 ${world.categories.length === 3 ? 'md:grid-cols-3' : 'md:grid-cols-2'} gap-4`}>
                            {world.categories.map(cat => (
                                <div key={cat.id} className={`rounded-2xl border-2 overflow-hidden ${cat.color}`}>
                                    <div className={`${cat.headerBg} text-white font-black px-4 py-2.5 flex items-center gap-2`}>
                                        <span>{cat.icon}</span> {cat.label}
                                    </div>
                                    <ul className="p-4 space-y-2">
                                        {world.sortItems.filter(i => i.category === cat.id).map(item => (
                                            <li key={item.id} className="bg-white/90 px-3 py-2 rounded-xl text-sm font-bold text-slate-700 shadow-sm border border-slate-100">
                                                - {item.text}
                                            </li>
                                        ))}
                                    </ul>
                                </div>
                            ))}
                        </div>

                        <div className="bg-slate-50 rounded-2xl border-2 border-slate-200 p-5">
                            <h3 className="text-xl font-black text-brand-deep mb-3">📝 Let's Read the Model Text: {world.subjectTitle}</h3>
                            <div className="space-y-3 text-base leading-relaxed font-semibold text-slate-700">
                                <div className="bg-orange-50 border-l-4 border-orange-400 p-4 rounded-r-xl">
                                    <span className="text-xs font-black uppercase text-orange-600 block mb-1">1. Identification</span>
                                    <p>{world.modelText.identification}</p>
                                </div>
                                <div className="bg-blue-50 border-l-4 border-blue-500 p-4 rounded-r-xl">
                                    <span className="text-xs font-black uppercase text-blue-600 block mb-1">2. Description</span>
                                    <p className="whitespace-pre-line">{world.modelText.description}</p>
                                </div>
                            </div>
                        </div>

                        <button onClick={onComplete} className="w-full btn-3d btn-primary py-4 text-xl">
                            NEXT: INTERACTIVE DRAG & DROP 🧲 (+20 Pts)
                        </button>
                    </div>
                </div>
            </div>
        );

        // =========================================================================
        // 11. STAGE 2: LIVE SHARED REAL-TIME DRAG & DROP CATEGORY SORTER
        //     When in a Multiplayer Room, every student's drag/drop is synced via Firestore
        //     and immediately visible to EVERYONE in the room with attribution badges!
        // =========================================================================
        const ScreenDragDropSorter = ({ world, roomCode, userName, showModal, onBack, onComplete }) => {
            const [bank, setBank] = useState(() => [...world.sortItems].sort(() => Math.random() - 0.5));
            const [boxes, setBoxes] = useState(() => {
                const init = {};
                world.categories.forEach(c => { init[c.id] = []; });
                return init;
            });
            const [selectedItem, setSelectedItem] = useState(null);
            const [dragOverCat, setDragOverCat] = useState(null);
            const [checkedStatus, setCheckedStatus] = useState(null);
            const [lastActionBanner, setLastActionBanner] = useState(null);

            const isLiveShared = !!(roomCode && window.FB_BRIDGE?.available);
            const boardDocId = `${roomCode}_${world.id}`;

            // Reset local state when switching worlds
            useEffect(() => {
                if (!isLiveShared) {
                    setBank([...world.sortItems].sort(() => Math.random() - 0.5));
                    const init = {};
                    world.categories.forEach(c => { init[c.id] = []; });
                    setBoxes(init);
                    setSelectedItem(null);
                    setCheckedStatus(null);
                }
            }, [world.id, isLiveShared]);

            // Subscribe to Real-Time Shared Board in Firestore when in Multiplayer Room
            useEffect(() => {
                if (!isLiveShared) return;
                const fb = window.FB_BRIDGE;
                if (!fb.uid) return;

                const boardRef = fb.pubDoc('dta_shared_boards', boardDocId);
                const unsub = fb.onSnapshot(
                    boardRef,
                    (snap) => {
                        if (snap.exists()) {
                            const data = snap.data();
                            if (data.placementsJson) {
                                try {
                                    const placements = JSON.parse(data.placementsJson); // map: itemId -> { catId, by }
                                    const newBoxes = {};
                                    world.categories.forEach(c => { newBoxes[c.id] = []; });
                                    const newBank = [];

                                    world.sortItems.forEach(item => {
                                        const placed = placements[item.id];
                                        if (placed && newBoxes[placed.catId]) {
                                            newBoxes[placed.catId].push({ ...item, movedBy: placed.by });
                                        } else {
                                            newBank.push(item);
                                        }
                                    });

                                    setBoxes(newBoxes);
                                    setBank(newBank);
                                    if (data.lastAction) setLastActionBanner(data.lastAction);
                                } catch (e) {
                                    console.error("Parse board error:", e);
                                }
                            }
                        } else {
                            // Initialize empty shared board
                            setBank([...world.sortItems]);
                            const init = {};
                            world.categories.forEach(c => { init[c.id] = []; });
                            setBoxes(init);
                        }
                    },
                    (err) => console.error("Shared board listener error:", err)
                );

                return () => unsub();
            }, [isLiveShared, boardDocId, world]);

            const syncSharedPlacements = async (newBoxes, actionText) => {
                if (!isLiveShared) return;
                const fb = window.FB_BRIDGE;
                if (!fb.uid) return;
                const placements = {};
                Object.keys(newBoxes).forEach(catId => {
                    newBoxes[catId].forEach(it => {
                        placements[it.id] = { catId, by: it.movedBy || userName };
                    });
                });
                try {
                    await fb.setDoc(fb.pubDoc('dta_shared_boards', boardDocId), {
                        roomCode,
                        worldId: world.id,
                        placementsJson: JSON.stringify(placements),
                        lastAction: actionText,
                        updatedAt: Date.now()
                    }, { merge: true });
                } catch (err) {
                    console.error("Sync board error:", err);
                }
            };

            const moveItemToCategory = (itemId, targetCatId) => {
                setCheckedStatus(null);
                let item = bank.find(i => i.id === itemId);
                let newBank = [...bank];
                const newBoxes = {};
                world.categories.forEach(c => { newBoxes[c.id] = [...boxes[c.id]]; });

                if (item) {
                    newBank = newBank.filter(i => i.id !== itemId);
                } else {
                    for (const catId of Object.keys(newBoxes)) {
                        const found = newBoxes[catId].find(i => i.id === itemId);
                        if (found) {
                            item = found;
                            newBoxes[catId] = newBoxes[catId].filter(i => i.id !== itemId);
                            break;
                        }
                    }
                }

                if (!item) return;

                const catObj = world.categories.find(c => c.id === targetCatId);
                if (targetCatId === 'bank') {
                    newBank.push({ ...item, movedBy: null });
                } else {
                    newBoxes[targetCatId].push({ ...item, movedBy: userName });
                }

                setBank(newBank);
                setBoxes(newBoxes);
                setSelectedItem(null);

                if (isLiveShared) {
                    const actionText = targetCatId === 'bank'
                        ? `${userName} mengembalikan "${item.text}" ke daftar`
                        : `${userName} memindahkan "${item.text}" ke ${catObj?.label || targetCatId}`;
                    syncSharedPlacements(newBoxes, actionText);
                }
            };

            const handleDragStart = (e, itemId) => {
                e.dataTransfer.setData('text/plain', itemId);
                setSelectedItem(itemId);
            };

            const handleDrop = (e, targetCatId) => {
                e.preventDefault();
                setDragOverCat(null);
                const itemId = e.dataTransfer.getData('text/plain') || selectedItem;
                if (itemId) moveItemToCategory(itemId, targetCatId);
            };

            const handleReset = () => {
                const init = {};
                world.categories.forEach(c => { init[c.id] = []; });
                setBank([...world.sortItems].sort(() => Math.random() - 0.5));
                setBoxes(init);
                setSelectedItem(null);
                setCheckedStatus(null);
                if (isLiveShared) {
                    syncSharedPlacements(init, `${userName} mereset papan bersama`);
                }
            };

            const handleCheck = () => {
                if (bank.length > 0) {
                    showModal("Almost There! 🧲", `Please sort all remaining ${bank.length} card(s) into the boxes first.`, "info");
                    return;
                }

                const statusMap = {};
                let correctCount = 0;
                world.categories.forEach(cat => {
                    boxes[cat.id].forEach(item => {
                        const isRight = item.category === cat.id;
                        statusMap[item.id] = isRight;
                        if (isRight) correctCount++;
                    });
                });
                setCheckedStatus(statusMap);

                if (correctCount === world.sortItems.length) {
                    showModal(
                        "Awesome Job! 🌟",
                        `You sorted all ${correctCount} phrases about ${world.subjectTitle} into the correct boxes!`,
                        "success",
                        onComplete
                    );
                } else {
                    showModal(
                        "Keep Trying! 🔍",
                        `You got ${correctCount} out of ${world.sortItems.length} correct. Red cards are in the wrong box—drag or tap them to move them!`,
                        "error"
                    );
                }
            };

            return (
                <div className={`flex-1 p-4 md:p-6 ${world.themeBg} overflow-y-auto`}>
                    <div className="max-w-5xl mx-auto">
                        <div className="flex flex-wrap justify-between items-center gap-2 mb-4">
                            <button onClick={onBack} className="btn-3d bg-white text-slate-700 border-2 border-slate-300 shadow-[0_4px_0_#cbd5e1] px-4 py-2 text-xs md:text-sm">
                                ⬅️ Back to {world.name}
                            </button>
                            <div className="flex items-center gap-2 flex-wrap">
                                {isLiveShared && (
                                    <span className="bg-green-100 text-green-800 border-2 border-green-400 text-xs font-black px-3 py-1 rounded-full flex items-center gap-1.5">
                                        <span className="w-2 h-2 rounded-full bg-green-500 animate-ping"></span>
                                        LIVE SHARED BOARD (Terlihat Semua Murid)
                                    </span>
                                )}
                                <span className={`text-xs font-black px-3 py-1.5 rounded-full border ${world.badgeColor}`}>
                                    🧲 Interactive Vocabulary Sorter • {world.subjectTitle}
                                </span>
                            </div>
                        </div>

                        <div className="game-card p-5 md:p-6 animate-pop space-y-5">
                            {/* Live Collaboration Banner */}
                            {isLiveShared && lastActionBanner && (
                                <div className="bg-emerald-50 border-2 border-emerald-300 rounded-xl px-4 py-2 text-xs font-black text-emerald-900 flex items-center gap-2">
                                    <span>⚡ Aktivitas Live:</span>
                                    <span>{lastActionBanner}</span>
                                </div>
                            )}

                            {/* Header + Picture */}
                            <div className="flex flex-col md:flex-row items-center gap-5 bg-slate-50 p-4 rounded-2xl border-2 border-slate-200">
                                <div className="w-full md:w-56 shrink-0">
                                    <TopicIllustration topicId={world.id} className="w-full h-36 rounded-xl" />
                                </div>
                                <div>
                                    <h2 className="text-2xl font-black text-brand-deep">Drag & Drop Into the Right Box!</h2>
                                    <p className="text-sm font-bold text-slate-600 mt-1">
                                        Look at the picture of <span className="text-brand-deep">{world.subjectTitle}</span>. Drag each phrase from the list below into the empty category boxes.
                                    </p>
                                    <p className="text-xs font-bold text-blue-600 mt-1">
                                        💡 Petunjuk: Seret kartu ke kotak kategori, atau klik kartu lalu klik kotak tujuannya (ramah layar sentuh!).
                                    </p>
                                </div>
                            </div>

                            {/* Empty Category Drop Boxes */}
                            <div className={`grid grid-cols-1 ${world.categories.length === 3 ? 'md:grid-cols-3' : 'md:grid-cols-2'} gap-4`}>
                                {world.categories.map(cat => (
                                    <div
                                        key={cat.id}
                                        onDragOver={(e) => { e.preventDefault(); setDragOverCat(cat.id); }}
                                        onDragLeave={() => setDragOverCat(null)}
                                        onDrop={(e) => handleDrop(e, cat.id)}
                                        onClick={() => { if (selectedItem) moveItemToCategory(selectedItem, cat.id); }}
                                        className={`drop-zone rounded-2xl border-4 border-dashed min-h-[210px] flex flex-col overflow-hidden ${cat.color} ${
                                            dragOverCat === cat.id ? 'drag-over' : ''
                                        } ${selectedItem ? 'cursor-pointer ring-2 ring-brand-sky/60' : ''}`}
                                    >
                                        <div className={`${cat.headerBg} text-white font-black px-4 py-2.5 flex justify-between items-center`}>
                                            <span>{cat.icon} {cat.label}</span>
                                            <span className="bg-white/25 px-2 py-0.5 rounded-full text-xs">{boxes[cat.id].length}</span>
                                        </div>
                                        <div className="p-3 flex-1 flex flex-col gap-2">
                                            {boxes[cat.id].length === 0 ? (
                                                <div className="flex-1 flex items-center justify-center text-slate-400 font-bold text-sm text-center p-4">
                                                    {selectedItem ? "Tap here to drop selected card!" : "Empty box — Drop phrases here"}
                                                </div>
                                            ) : (
                                                boxes[cat.id].map(item => {
                                                    const status = checkedStatus ? checkedStatus[item.id] : null;
                                                    return (
                                                        <div
                                                            key={item.id}
                                                            draggable
                                                            onDragStart={(e) => handleDragStart(e, item.id)}
                                                            onClick={(e) => {
                                                                e.stopPropagation();
                                                                moveItemToCategory(item.id, 'bank');
                                                            }}
                                                            title="Drag to move or click to return to bank"
                                                            className={`drag-chip px-3 py-2 rounded-xl font-bold text-sm shadow-sm border-2 flex justify-between items-center gap-2 ${
                                                                status === true ? 'bg-green-100 border-green-500 text-green-900' :
                                                                status === false ? 'bg-red-100 border-red-500 text-red-900' :
                                                                'bg-white border-slate-200 text-slate-800 hover:border-brand-sky'
                                                            }`}
                                                        >
                                                            <div className="flex flex-col">
                                                                <span>{item.text}</span>
                                                                {isLiveShared && item.movedBy && (
                                                                    <span className="text-[10px] font-black text-blue-600">
                                                                        👤 oleh {item.movedBy}
                                                                    </span>
                                                                )}
                                                            </div>
                                                            <span className="text-xs opacity-60 shrink-0">
                                                                {status === true ? '✅' : status === false ? '❌' : '↩️'}
                                                            </span>
                                                        </div>
                                                    );
                                                })
                                            )}
                                        </div>
                                    </div>
                                ))}
                            </div>

                            {/* Shuffled Word/Phrase Bank */}
                            <div
                                onDragOver={(e) => e.preventDefault()}
                                onDrop={(e) => handleDrop(e, 'bank')}
                                className="bg-slate-100 rounded-2xl p-4 border-2 border-slate-300"
                            >
                                <div className="flex justify-between items-center mb-3">
                                    <h3 className="font-black text-slate-700 text-sm uppercase">
                                        📦 Phrase List ({bank.length} remaining)
                                    </h3>
                                    {selectedItem && (
                                        <span className="text-xs font-black text-blue-600 animate-pulse">
                                            Card selected! Tap a box above to drop it.
                                        </span>
                                    )}
                                </div>
                                {bank.length === 0 ? (
                                    <p className="text-center text-green-600 font-black py-3">
                                        🎉 All cards placed! Click "CHECK ANSWERS" below.
                                    </p>
                                ) : (
                                    <div className="flex flex-wrap gap-2">
                                        {bank.map(item => (
                                            <button
                                                key={item.id}
                                                type="button"
                                                draggable
                                                onDragStart={(e) => handleDragStart(e, item.id)}
                                                onClick={() => setSelectedItem(selectedItem === item.id ? null : item.id)}
                                                className={`drag-chip px-3.5 py-2 rounded-xl font-bold text-sm border-2 shadow-[0_3px_0_#cbd5e1] text-left ${
                                                    selectedItem === item.id
                                                        ? 'bg-brand-yellow border-yellow-600 text-yellow-950 scale-105'
                                                        : 'bg-white border-slate-300 text-slate-800 hover:bg-blue-50'
                                                }`}
                                            >
                                                {item.text}
                                            </button>
                                        ))}
                                    </div>
                                )}
                            </div>

                            <div className="flex flex-col sm:flex-row gap-3">
                                <button onClick={handleReset} className="sm:w-1/3 btn-3d bg-slate-200 text-slate-700 border-2 border-slate-300 shadow-[0_4px_0_#94a3b8] py-3.5">
                                    🔄 RESET
                                </button>
                                <button onClick={handleCheck} className="sm:w-2/3 btn-3d btn-primary py-3.5 text-lg">
                                    ✅ CHECK ANSWERS
                                </button>
                            </div>
                        </div>
                    </div>
                </div>
            );
        };

        // =========================================================================
        // 12. STAGE 3: GRAMMAR DETECTIVE (TOPIC-ALIGNED & FINAL BOSS)
        // =========================================================================
        const ScreenGrammar = ({ data, title = "Grammar Detective", world = null, onBack, onComplete, showModal, isFinal = false }) => {
            const [currentQ, setCurrentQ] = useState(0);

            useEffect(() => { setCurrentQ(0); }, [data]);

            const handleAnswer = (index) => {
                const q = data[currentQ];
                if (index === q.correct) {
                    showModal("Correct! 🎯", q.exp || "Great grammar detective work!", "success", () => {
                        nextQuestion();
                    });
                } else {
                    showModal("Not Quite ❌", `Hint: ${q.exp || "Check the subject and verb agreement!"}`, "error");
                }
            };

            const nextQuestion = () => {
                if (currentQ < data.length - 1) setCurrentQ(q => q + 1);
                else {
                    if (isFinal) {
                        showModal("Final Challenge Complete! 🏆", "You conquered the Final Descriptive Boss!", "success", onComplete);
                    } else {
                        onComplete();
                    }
                }
            };

            const q = data[currentQ];

            return (
                <div className={`flex-1 p-4 md:p-6 flex flex-col items-center justify-center ${isFinal ? 'bg-gradient-to-b from-red-900 to-slate-900' : (world ? world.themeBg : 'bg-slate-800')}`}>
                    <div className="w-full max-w-2xl mb-4 flex justify-between items-center">
                        <button onClick={onBack} className="btn-3d bg-white text-slate-700 border-2 border-slate-300 shadow-[0_4px_0_#cbd5e1] px-3 py-1.5 text-xs">
                            ⬅️ Back
                        </button>
                        <span className={`font-black text-sm ${isFinal ? 'text-yellow-300' : 'text-slate-700'}`}>
                            {currentQ + 1} / {data.length}
                        </span>
                    </div>

                    <div className="game-card w-full max-w-2xl p-6 md:p-8 animate-pop">
                        <div className="text-center mb-4">
                            <span className="text-4xl">{isFinal ? '👑' : '🔍'}</span>
                            <div className="text-xs font-black uppercase text-brand-purple mt-1">{title}</div>
                        </div>

                        {world && (
                            <div className="max-w-xs mx-auto mb-5">
                                <TopicIllustration topicId={world.id} className="w-full h-32 rounded-xl" />
                            </div>
                        )}

                        <h3 className="text-xl md:text-2xl font-black text-slate-800 mb-6 text-center">{q.q}</h3>
                        <div className="space-y-3">
                            {q.options.map((opt, i) => (
                                <button key={i} onClick={() => handleAnswer(i)} className="w-full btn-3d btn-secondary py-3.5 text-left px-5 text-base md:text-lg justify-start">
                                    <span className="bg-white/70 text-blue-900 w-8 h-8 rounded-full inline-flex items-center justify-center mr-3 font-black shrink-0">
                                        {String.fromCharCode(65 + i)}
                                    </span>
                                    <span className="normal-case">{opt}</span>
                                </button>
                            ))}
                        </div>
                    </div>
                </div>
            );
        };

        // =========================================================================
        // 13. STAGE 4: SENTENCE BUILDER
        // =========================================================================
        const ScreenSentenceBuilder = ({ world, onBack, onComplete, showModal }) => {
            const data = world.sentences;
            const [currentQ, setCurrentQ] = useState(0);
            const [selectedWords, setSelectedWords] = useState([]);
            const [availableWords, setAvailableWords] = useState([]);

            const shuffle = (arr) => [...arr].sort(() => Math.random() - 0.5);

            useEffect(() => { setCurrentQ(0); }, [world.id]);

            useEffect(() => {
                setAvailableWords(shuffle(data[currentQ].words));
                setSelectedWords([]);
            }, [currentQ, data]);

            const handleSelect = (word, index) => {
                setSelectedWords([...selectedWords, word]);
                setAvailableWords(availableWords.filter((_, i) => i !== index));
            };

            const handleDeselect = (word, index) => {
                setAvailableWords([...availableWords, word]);
                setSelectedWords(selectedWords.filter((_, i) => i !== index));
            };

            const handleCheck = () => {
                const answer = selectedWords.join(" ");
                if (answer === data[currentQ].correct) {
                    showModal("Amazing! ⭐", `Correct sentence:\n"${answer}"`, "success", () => {
                        if (currentQ < data.length - 1) setCurrentQ(q => q + 1);
                        else onComplete();
                    });
                } else {
                    showModal("Not Quite! 🚧", "Check the word order carefully and try again.", "error");
                }
            };

            return (
                <div className={`flex-1 p-4 md:p-6 ${world.themeBg} flex flex-col items-center justify-center`}>
                    <div className="w-full max-w-3xl mb-3 flex justify-between items-center">
                        <button onClick={onBack} className="btn-3d bg-white text-slate-700 border-2 border-slate-300 shadow-[0_4px_0_#cbd5e1] px-3 py-1.5 text-xs">
                            ⬅️ Back to {world.name}
                        </button>
                        <span className="font-black text-slate-600 text-sm">Sentence {currentQ + 1} / {data.length}</span>
                    </div>

                    <div className="game-card w-full max-w-3xl p-6 md:p-8 animate-pop">
                        <div className="text-center mb-4">
                            <span className={`inline-block text-xs font-black px-3 py-1 rounded-full border mb-2 ${world.badgeColor}`}>
                                🧩 Sentence Builder • {world.subjectTitle}
                            </span>
                            <h2 className="text-2xl md:text-3xl font-black text-brand-deep">Arrange the Words!</h2>
                        </div>

                        <div className="max-w-xs mx-auto mb-5">
                            <TopicIllustration topicId={world.id} className="w-full h-32 rounded-xl" />
                        </div>

                        <div className="bg-slate-100 rounded-2xl min-h-[96px] p-4 flex flex-wrap gap-2 mb-6 border-4 border-dashed border-slate-300 items-center justify-center">
                            {selectedWords.length === 0 && <span className="text-slate-400 font-bold text-sm">Tap words below to build a sentence...</span>}
                            {selectedWords.map((word, i) => (
                                <button key={`sel-${i}`} onClick={() => handleDeselect(word, i)}
                                    className="bg-brand-yellow text-yellow-950 font-black px-4 py-2 rounded-xl shadow-[0_4px_0_#ca8a04] hover:bg-yellow-300 text-base md:text-lg">
                                    {word}
                                </button>
                            ))}

            const addSentenceToBox = (item) => {
                setParagraphText(prev => {
                    const trimmed = prev.trim();
                    return trimmed ? `${trimmed} ${item.text}` : item.text;

                if (!usedIds.includes(item.id)) {
                    setUsedIds(prev => [...prev, item.id]);

            const handleDropIntoParagraph = (e) => {
                e.preventDefault();

                if (found) addSentenceToBox(found);
            };

            const wordCount = paragraphText.trim().split(/\s+/).filter(Boolean).length;

                        "Add More Details! ✍️",
                        "Click or drag more phrases from each category group into the paragraph box (at least 20 words).",
                        "info"
                    );
                    return;
                }

                const hasBe = /\b(is|am|are)\b/.test(lower);
                const hasHave = /\b(has|have|feel|swim|surf|located)\b/.test(lower);

                onSaveWriting(paragraphText);

                    "Wonderful Paragraph! 🌟",
                    `Great job composing a complete descriptive paragraph about ${world.subjectTitle}!\n\nWord count: ${wordCount} words\nGrammar check: ${hasBe && hasHave ? 'Uses To Be & Descriptive Verbs!' : 'Good start!'}\n\nNote: Your final writing is saved and ready for teacher feedback.`,

                    onComplete

                const a = document.createElement('a');

                                    <div key={cat.id} className={`rounded-2xl border-2 overflow-hidden ${cat.color}`}>

                    ))}
                </div>

                <div className="flex flex-wrap gap-4 justify-center">
                    <button onClick={onOpenCertificate} className="btn-3d btn-primary py-3.5 px-8 text-lg">
                        🏆 Klaim & Download Sertifikat (PNG/PDF)
                    </button>
                    <button onClick={onRestart} className="btn-3d bg-white text-brand-deep py-3.5 px-8 text-lg rounded-full">
                        🔄 Play Again
                    </button>
                </div>
            </div>
        );

        // =========================================================================
        // 16. TEACHER DASHBOARD & LIVE MULTIPLAYER HOST CONTROLLER
        // =========================================================================
        const ScreenTeacherDashboard = ({
            fbReady, roomCode, setRoomCode, roomData, roomPlayers,
            voiceMuted, onToggleMute, activeSpeaker, showModal, onBack
        }) => {
            const [sessions, setSessions] = useState([]);
            const [focusTitle, setFocusTitle] = useState('Penjelasan Guru: Descriptive Text');
            const [focusMessage, setFocusMessage] = useState('Perhatikan penjelasan guru tentang Identification & Description sebelum kita mulai Drag & Drop bersama!');
            const [focusTopic, setFocusTopic] = useState('people');
            const [selectedSharedWorld, setSelectedSharedWorld] = useState('people');
            const [copied, setCopied] = useState(false);

            useEffect(() => {
                if (!fbReady || !window.FB_BRIDGE?.available || !window.FB_BRIDGE?.uid) return;
                const fb = window.FB_BRIDGE;
                const unsub = fb.onSnapshot(
                    fb.pubCollection('dta_sessions'),
                    (snap) => {
                        const list = [];
                        snap.forEach(d => list.push({ id: d.id, ...d.data() }));
                        list.sort((a, b) => new Date(b.date) - new Date(a.date));
                        setSessions(list);
                    },
                    (err) => console.error("Sessions listener error:", err)
                );
                return () => unsub();
            }, [fbReady]);

            const createLiveRoom = async () => {
                if (!window.FB_BRIDGE?.available) {
                    showModal("Cloud Offline", "Firebase connection is required to host a live multiplayer room.", "error");
                    return;
                }
                const newCode = generateRoomCode();
                try {
                    const fb = window.FB_BRIDGE;
                    await fb.setDoc(fb.pubDoc('dta_rooms', newCode), {
                        roomCode: newCode,
                        hostUid: fb.uid,
                        focusMode: false,
                        focusTitle,
                        focusMessage,
                        focusTopic,
                        createdAt: Date.now()
                    });
                    setRoomCode(newCode);
                } catch (err) {
                    showModal("Error", "Gagal membuat room: " + err.message, "error");
                }
            };

            const toggleFocusMode = async (enable) => {
                if (!roomCode || !window.FB_BRIDGE?.available) return;
                try {
                    const fb = window.FB_BRIDGE;
                    await fb.setDoc(fb.pubDoc('dta_rooms', roomCode), {
                        focusMode: enable,
                        focusTitle,
                        focusMessage,
                        focusTopic,
                        updatedAt: Date.now()
                    }, { merge: true });
                } catch (err) {
                    console.error(err);
                }
            };

            const assignLiveDragDrop = async () => {
                if (!roomCode || !window.FB_BRIDGE?.available) return;
                try {
                    const fb = window.FB_BRIDGE;
                    await fb.setDoc(fb.pubDoc('dta_rooms', roomCode), {
                        focusMode: false,
                        assignedTask: {
                            worldId: selectedSharedWorld,
                            screen: 'world_vocab',
                            timestamp: Date.now()
                        }
                    }, { merge: true });
                    await fb.addDoc(fb.pubCollection('dta_chat'), {
                        roomCode,
                        senderId: 'system',
                        senderName: 'GURU',
                        senderAvatar: '👩‍🏫',
                        role: 'teacher',
                        text: `🧲 Tugas Live Drag & Drop (${WORLDS_DATA[selectedSharedWorld].subjectTitle}) dimulai! Semua murid dapat mengerjakan bersama.`,
                        createdAt: Date.now()
                    });
                    showModal("Tugas Dikirim! 🚀", `Semua murid di room ${roomCode} otomatis diarahkan ke papan Drag & Drop bersama (${WORLDS_DATA[selectedSharedWorld].subjectTitle})!`, "success");
                } catch (err) {
                    console.error(err);
                }
            };

            const handleCopyCode = () => {
                if (!roomCode) return;
                copyToClipboard(roomCode);
                setCopied(true);
                setTimeout(() => setCopied(false), 2000);
            };

            const exportCSV = () => {
                if (sessions.length === 0) return;
                const headers = ["Student", "Class", "Group", "Room", "Points", "Stars", "Confidence", "Date"];
                const rows = sessions.map(r => [
                    `"${r.user?.name || ''}"`,
                    `"${r.user?.class || ''}"`,
                    `"${r.user?.groupName || ''}"`,
                    `"${r.roomCode || 'SOLO'}"`,
                    r.progress?.points || 0,
                    r.progress?.stars || 0,
                    `"${r.reflection?.confidence || ''}"`,
                    `"${new Date(r.date).toLocaleDateString()}"`
                ].join(","));
                const csv = [headers.join(","), ...rows].join("\n");
                const blob = new Blob([csv], { type: 'text/csv;charset=utf-8;' });
                const url = URL.createObjectURL(blob);
                const a = document.createElement('a');
                a.href = url;
                a.download = "descriptive_text_adventure_recap.csv";
                a.click();
                URL.revokeObjectURL(url);
            };

            const isFocusOn = !!roomData?.focusMode;

            return (
                <div className="flex-1 p-4 md:p-6 bg-slate-100 flex flex-col overflow-y-auto">
                    <div className="max-w-6xl mx-auto w-full space-y-6">
                        <div className="flex flex-wrap justify-between items-center gap-3">
                            <div>
                                <h2 className="text-2xl md:text-3xl font-black text-brand-deep">👩‍🏫 Teacher Dashboard & Live Room Host</h2>
                                <p className="text-xs font-bold text-slate-500">Buat Kode Bergabung, Aktifkan Mode Fokus, Walkie-Talkie, & Pantau Nilai Murid Real-Time</p>
                            </div>
                            <div className="flex items-center gap-2 flex-wrap">
                                {roomCode && (
                                    <WalkieTalkieControl
                                        roomCode={roomCode}
                                        senderName="Guru (Host)"
                                        senderAvatar="👩‍🏫"
                                        isTeacher={true}
                                        voiceMuted={voiceMuted}
                                        onToggleMute={onToggleMute}
                                        activeSpeaker={activeSpeaker}
                                        showModal={showModal}
                                    />
                                )}
                                <button onClick={exportCSV} disabled={sessions.length === 0} className="btn-3d btn-success px-4 py-2 text-xs">
                                    ⬇️ Download CSV
                                </button>
                                <button onClick={onBack} className="btn-3d bg-slate-300 text-slate-800 border-2 border-slate-400 shadow-[0_4px_0_#94a3b8] px-4 py-2 text-xs">
                                    ⬅️ Back to Home
                                </button>
                            </div>
                        </div>

                        {/* Live Multiplayer Room Control Card */}
                        <div className="grid grid-cols-1 lg:grid-cols-2 gap-6">
                            {/* Room Code & Focus Mode */}
                            <div className="game-card p-6 space-y-5">
                                <div className="flex items-center justify-between">
                                    <h3 className="text-lg font-black text-brand-deep">🌐 Live Multiplayer Room</h3>
                                    {roomCode && (
                                        <span className="bg-green-100 text-green-700 text-xs font-black px-3 py-1 rounded-full border border-green-300">
                                            🟢 LIVE AKTIF
                                        </span>
                                    )}
                                </div>

                                {!roomCode ? (
                                    <div className="bg-blue-50 border-2 border-blue-200 rounded-2xl p-6 text-center space-y-4">
                                        <p className="font-bold text-slate-700 text-sm">
                                            Buat Room Multiplayer baru untuk mendapatkan <strong>Kode Bergabung</strong> yang bisa dibagikan ke seluruh murid.
                                        </p>
                                        <button onClick={createLiveRoom} className="btn-3d btn-primary px-8 py-4 text-lg">
                                            ✨ BUAT ROOM & KODE BERGABUNG
                                        </button>
                                    </div>
                                ) : (
                                    <div className="space-y-4">
                                        <div className="bg-brand-deep text-white rounded-2xl p-4 flex flex-wrap items-center justify-between gap-3">
                                            <div>
                                                <div className="text-xs font-bold text-brand-sky uppercase">Kode Bergabung Murid:</div>
                                                <div className="text-3xl md:text-4xl font-black tracking-widest text-brand-yellow">{roomCode}</div>
                                            </div>
                                            <button onClick={handleCopyCode} className="btn-3d btn-secondary px-4 py-2.5 text-xs">
                                                {copied ? '✅ TERSALIN!' : '📋 SALIN KODE'}
                                            </button>
                                        </div>

                                        {/* Focus Mode Controls */}
                                        <div className={`p-4 rounded-2xl border-2 space-y-3 ${isFocusOn ? 'bg-red-50 border-red-400' : 'bg-slate-50 border-slate-200'}`}>
                                            <div className="flex items-center justify-between">
                                                <span className="font-black text-sm text-slate-800">🎯 Mode Fokus Guru (Kunci Layar Murid)</span>
                                                <span className={`text-xs font-black px-2.5 py-0.5 rounded-full ${isFocusOn ? 'bg-red-500 text-white' : 'bg-slate-300 text-slate-700'}`}>
                                                    {isFocusOn ? 'AKTIF' : 'NONAKTIF'}
                                                </span>
                                            </div>
                                            <input
                                                type="text"
                                                value={focusTitle}
                                                onChange={e => setFocusTitle(e.target.value)}
                                                className="w-full bg-white border-2 border-slate-200 rounded-xl p-2.5 text-sm font-bold"
                                                placeholder="Judul Penjelasan..."
                                            />
                                            <textarea
                                                rows="2"
                                                value={focusMessage}
                                                onChange={e => setFocusMessage(e.target.value)}
                                                className="w-full bg-white border-2 border-slate-200 rounded-xl p-2.5 text-sm font-semibold"
                                                placeholder="Pesan penjelasan guru..."
                                            />
                                            <div className="flex flex-wrap gap-2 items-center">
                                                <select
                                                    value={focusTopic}
                                                    onChange={e => setFocusTopic(e.target.value)}
                                                    className="bg-white border-2 border-slate-200 rounded-xl px-3 py-2 text-xs font-bold"
                                                >
                                                    {Object.values(WORLDS_DATA).map(w => (
                                                        <option key={w.id} value={w.id}>Gambar: {w.subjectTitle}</option>
                                                    ))}
                                                </select>
                                                <button
                                                    onClick={() => toggleFocusMode(!isFocusOn)}
                                                    className={`flex-1 btn-3d py-2.5 text-xs ${isFocusOn ? 'btn-success' : 'btn-danger'}`}
                                                >
                                                    {isFocusOn ? '🔓 MATIKAN MODE FOKUS' : '🔒 AKTIFKAN MODE FOKUS'}
                                                </button>
                                            </div>
                                        </div>

                                        {/* Assign Shared Live Drag & Drop */}
                                        <div className="bg-purple-50 border-2 border-purple-200 rounded-2xl p-4 space-y-3">
                                            <div className="font-black text-sm text-purple-900">🧲 Kirim Tugas Drag & Drop Bersama (Live)</div>
                                            <p className="text-xs font-bold text-purple-700">
                                                Semua murid otomatis masuk ke papan Drag & Drop yang sama dan saling melihat kartu yang dipindahkan!
                                            </p>
                                            <div className="flex gap-2">
                                                <select
                                                    value={selectedSharedWorld}
                                                    onChange={e => setSelectedSharedWorld(e.target.value)}
                                                    className="flex-1 bg-white border-2 border-purple-300 rounded-xl px-3 py-2 text-xs font-bold"
                                                >
                                                    {Object.values(WORLDS_DATA).map(w => (
                                                        <option key={w.id} value={w.id}>{w.icon} {w.name} ({w.subjectTitle})</option>
                                                    ))}
                                                </select>
                                                <button onClick={assignLiveDragDrop} className="btn-3d btn-purple px-4 py-2 text-xs">
                                                    🚀 MULAI TUGAS
                                                </button>
                                            </div>
                                        </div>
                                    </div>
                                )}
                            </div>

                            {/* Live Connected Students & Leaderboard */}
                            <div className="game-card p-6 flex flex-col">
                                <div className="flex justify-between items-center mb-4">
                                    <h3 className="text-lg font-black text-brand-deep">🏆 Peringkat Murid Live ({roomPlayers.length})</h3>
                                    {roomData?.certificateWinner && (
                                        <span className="bg-amber-100 text-amber-800 border border-amber-300 px-2.5 py-1 rounded-full text-[11px] font-black">
                                            👑 Sertifikat #1: {roomData.certificateWinner.name}
                                        </span>
                                    )}
                                </div>
                                <div className="flex-1 overflow-y-auto max-h-[380px] space-y-2.5">
                                    {roomPlayers.length === 0 ? (
                                        <div className="text-center py-12 text-slate-400 font-bold text-sm">
                                            {roomCode
                                                ? `Menunggu murid bergabung dengan kode ${roomCode}...`
                                                : 'Buat Room terlebih dahulu untuk memantau murid secara real-time.'}
                                        </div>
                                    ) : (
                                        roomPlayers.map((p, idx) => (
                                            <div key={p.uid} className="flex items-center justify-between p-3 rounded-2xl bg-slate-50 border-2 border-slate-200">
                                                <div className="flex items-center gap-3">
                                                    <div className="flex flex-col items-center">
                                                        <span className="text-[10px] font-black bg-brand-deep text-brand-yellow px-2 rounded-full mb-0.5">
                                                            Lv.{getLevelFromPoints(p.points)} • {p.points || 0} Pts
                                                        </span>
                                                        <div className="w-10 h-10 rounded-full bg-white border-2 border-slate-300 flex items-center justify-center text-2xl">
                                                            {p.avatar || '🕵️‍♂️'}
                                                        </div>
                                                    </div>
                                                    <div>
                                                        <div className="font-black text-slate-800 text-sm">
                                                            #{idx + 1} {p.name} {idx === 0 ? '👑' : ''}
                                                        </div>
                                                        <div className="text-xs font-bold text-slate-500">
                                                            {p.className ? `Kelas ${p.className} • ` : ''}{p.activity || 'Exploring'}
                                                        </div>
                                                    </div>
                                                </div>
                                                <div className="text-right">
                                                    <div className="text-sm font-black text-amber-600">⭐ {p.stars || 0}</div>
                                                </div>
                                            </div>
                                        ))
                                    )}
                                </div>
                            </div>
                        </div>

                        {/* Completed Sessions History */}
                        <div className="bg-white rounded-2xl p-6 shadow-sm border border-slate-200">
                            <h3 className="text-lg font-black text-slate-800 mb-3">📋 Rekap Sesi Selesai (Cloud Realtime)</h3>
                            {sessions.length === 0 ? (
                                <p className="text-center text-slate-500 py-8 font-bold text-sm">Belum ada murid yang menyelesaikan refleksi akhir.</p>
                            ) : (
                                <div className="overflow-x-auto">
                                    <table className="w-full text-left border-collapse">
                                        <thead>
                                            <tr className="bg-slate-100 text-slate-600 text-sm">
                                                <th className="p-3 border-b-2 font-black">Student</th>
                                                <th className="p-3 border-b-2 font-black">Class / Room</th>
                                                <th className="p-3 border-b-2 font-black text-center">Score</th>
                                                <th className="p-3 border-b-2 font-black">Reflection</th>
                                                <th className="p-3 border-b-2 font-black">Date</th>
                                            </tr>
                                        </thead>
                                        <tbody>
                                            {sessions.map((row, i) => (
                                                <tr key={row.id || i} className="border-b hover:bg-slate-50 text-sm">
                                                    <td className="p-3 font-bold text-slate-800">{row.user?.name}</td>
                                                    <td className="p-3 text-slate-600">{row.user?.class || '-'} / {row.roomCode || 'SOLO'}</td>
                                                    <td className="p-3 text-center">
                                                        <span className="bg-green-100 text-green-700 px-2.5 py-1 rounded-full text-xs font-black">{row.progress?.points} pts</span>
                                                    </td>
                                                    <td className="p-3">{row.reflection?.confidence || '-'}</td>
                                                    <td className="p-3 text-xs text-slate-400">{new Date(row.date).toLocaleDateString()}</td>
                                                </tr>
                                            ))}
                                        </tbody>
                                    </table>
                                </div>
                            )}
                        </div>
                    </div>
                </div>
            );
        };

        // --- RENDER ---
        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
