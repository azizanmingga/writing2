    <!-- Firebase Realtime Multiplayer Bridge (Strict Firestore Rules) -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
        import { getAuth, signInAnonymously, signInWithCustomToken } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js";
        import {
            getFirestore, doc, getDoc, setDoc, updateDoc, addDoc, onSnapshot, collection
        } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js";

        const appId = typeof __app_id !== 'undefined' ? __app_id : 'default-app-id';

        window.FB_BRIDGE = {
            ready: false,
            available: false,
            appId,
            uid: null,
            db: null,
            auth: null,
            error: null,
            // Helper references adhering strictly to /artifacts/{appId}/public/data/{collectionName}
            pubCollection: (colName) => collection(window.FB_BRIDGE.db, 'artifacts', appId, 'public', 'data', colName),
            pubDoc: (colName, docId) => doc(window.FB_BRIDGE.db, 'artifacts', appId, 'public', 'data', colName, docId),
            getDoc,
            setDoc,
            updateDoc,
            addDoc,
            onSnapshot
        };

        async function initFirebase() {
            try {
                if (typeof __firebase_config === 'undefined' || !__firebase_config) {
                    window.FB_BRIDGE.error = "No Firebase config detected (Offline Demo Mode)";
                    window.FB_BRIDGE.ready = true;
                    window.dispatchEvent(new Event('fb-ready'));
                    return;
                }

                const firebaseConfig = typeof __firebase_config === 'string'
                    ? JSON.parse(__firebase_config)
                    : __firebase_config;

                const app = initializeApp(firebaseConfig);
                const auth = getAuth(app);
                const db = getFirestore(app);

                // RULE 3: Authenticate FIRST before any Firestore operation
                let cred;
                if (typeof __initial_auth_token !== 'undefined' && __initial_auth_token) {
                    cred = await signInWithCustomToken(auth, __initial_auth_token);
                } else {
                    cred = await signInAnonymously(auth);
                }

                window.FB_BRIDGE.auth = auth;
                window.FB_BRIDGE.db = db;
                window.FB_BRIDGE.uid = cred?.user?.uid || auth.currentUser?.uid || crypto.randomUUID();
                window.FB_BRIDGE.available = true;
                window.FB_BRIDGE.ready = true;
                window.dispatchEvent(new Event('fb-ready'));
            } catch (err) {
                console.error("Firebase init error:", err);
                window.FB_BRIDGE.error = err.message;
                window.FB_BRIDGE.ready = true;
                window.dispatchEvent(new Event('fb-ready'));
            }
        }

        initFirebase();
    </script>

        // Walkie-Talkie Push-to-Talk Button Component
        const WalkieTalkieControl = ({ roomCode, senderName, senderAvatar, isTeacher = false, voiceMuted, onToggleMute, activeSpeaker, showModal }) => {
            const [isRecording, setIsRecording] = useState(false);
            const mediaRecorderRef = useRef(null);
            const chunksRef = useRef([]);
            const timeoutRef = useRef(null);

            const startTalking = async (e) => {
                if (e && e.preventDefault) e.preventDefault();
                if (!roomCode || !window.FB_BRIDGE?.available) {
                    showModal("Walkie-Talkie Offline 📻", "Join a Multiplayer Room with a Teacher's Room Code first to use Walkie-Talkie!", "info");
                    return;
                }
                if (isRecording) return;

                try {
                    const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
                    let options = {};
                    if (MediaRecorder.isTypeSupported('audio/webm;codecs=opus')) {
                        options = { mimeType: 'audio/webm;codecs=opus', audioBitsPerSecond: 16000 };
                    } else if (MediaRecorder.isTypeSupported('audio/webm')) {
                        options = { mimeType: 'audio/webm' };
                    }

                    const recorder = new MediaRecorder(stream, options);
                    chunksRef.current = [];

                    recorder.ondataavailable = (ev) => {
                        if (ev.data && ev.data.size > 0) chunksRef.current.push(ev.data);
                    };

                    recorder.onstop = async () => {
                        stream.getTracks().forEach(t => t.stop());
                        if (chunksRef.current.length === 0) return;

                        const mime = recorder.mimeType || 'audio/webm';
                        const blob = new Blob(chunksRef.current, { type: mime });
                        if (blob.size < 400) return; // Too short / accidental tap

                        const reader = new FileReader();
                        reader.onloadend = async () => {
                            try {
                                const fb = window.FB_BRIDGE;
                                if (!fb.available || !fb.uid) return;
                                await fb.addDoc(fb.pubCollection('dta_voice'), {
                                    roomCode,
                                    senderId: fb.uid,
                                    senderName: senderName || (isTeacher ? 'Teacher' : 'Student'),
                                    senderAvatar: senderAvatar || (isTeacher ? '👩‍🏫' : '🕵️‍♂️'),
                                    role: isTeacher ? 'teacher' : 'student',
                                    audioData: reader.result,
                                    createdAt: Date.now()
                                });
                            } catch (err) {
                                console.error("Voice upload error:", err);
                            }
                        };
                        reader.readAsDataURL(blob);
                    };

                    mediaRecorderRef.current = recorder;
                    recorder.start();
                    setIsRecording(true);

                    // Safety cap 10 seconds per push-to-talk burst
                    timeoutRef.current = setTimeout(() => {
                        stopTalking();
                    }, 10000);
                } catch (err) {
                    showModal("Microphone Access Needed 🎙️", "Please allow microphone permission in your browser to use the Walkie-Talkie.", "error");
                }
            };

            const stopTalking = () => {
                if (timeoutRef.current) {
                    clearTimeout(timeoutRef.current);
                    timeoutRef.current = null;
                }
                if (mediaRecorderRef.current && mediaRecorderRef.current.state !== 'inactive') {
                    mediaRecorderRef.current.stop();
                }
                setIsRecording(false);
            };

            return (
                <div className="flex items-center gap-1.5">
                    <button
                        type="button"
                        onMouseDown={startTalking}
                        onMouseUp={stopTalking}
                        onMouseLeave={stopTalking}
                        onTouchStart={startTalking}
                        onTouchEnd={stopTalking}
                        className={`btn-3d px-3 py-1.5 text-xs rounded-xl flex items-center gap-1.5 select-none ${
                            isRecording
                                ? 'bg-red-500 text-white border-2 border-red-200 shadow-[0_0_16px_rgba(239,68,68,0.85)] scale-105'
                                : 'bg-emerald-400 text-emerald-950 border-2 border-emerald-200 shadow-[0_4px_0_#059669]'
                        }`}
                        title="Tahan untuk berbicara (Push-to-Talk)"
                    >
                        <span className="text-base">{isRecording ? '🔴' : '🎙️'}</span>
                        <span className="hidden sm:inline">{isRecording ? 'MEREKAM...' : 'TAHAN BICARA'}</span>
                    </button>
                    <button
                        type="button"
                        onClick={onToggleMute}
                        className={`p-1.5 rounded-xl border-2 text-xs font-black transition ${
                            voiceMuted ? 'bg-slate-700 border-slate-500 text-slate-300' : 'bg-blue-800 border-blue-500 text-white'
                        }`}
                        title={voiceMuted ? "Suara Walkie-Talkie Mati" : "Suara Walkie-Talkie Aktif"}
                    >

        // Minimizable Floating Dock: Daftar Murid (Student List) & Kolom Chat

        // Certificate Claim & PNG/PDF Download Modal
        const CertificateModal = ({ show, onClose, user, progress, players, roomCode, roomData, myUid, showModal }) => {
            const canvasRef = useRef(null);
            const [claimed, setClaimed] = useState(false);

            const sortedPlayers = useMemo(() => {
                if (players && players.length > 0) {
                    return [...players].sort((a, b) => (b.points || 0) - (a.points || 0));
                }
                return [{ uid: myUid || 'local', name: user.name || 'Young Detective', points: progress.points, stars: progress.stars }];
            }, [players, myUid, user.name, progress.points, progress.stars]);

            const myRankIndex = sortedPlayers.findIndex(p => p.uid === (myUid || 'local'));
            const myRank = myRankIndex >= 0 ? myRankIndex + 1 : 1;
            const isTopScorer = myRank === 1 && (progress.points > 0);
            const canClaim = progress.points >= 20 || isTopScorer;

            const existingWinner = roomData?.certificateWinner;

            useEffect(() => {
                if (!show || !canvasRef.current) return;
                const canvas = canvasRef.current;
                const ctx = canvas.getContext('2d');
                const W = 1200;
                const H = 850;
                canvas.width = W;
                canvas.height = H;

                // Background gradient
                const grad = ctx.createLinearGradient(0, 0, W, H);
                grad.addColorStop(0, '#f8fafc');
                grad.addColorStop(0.5, '#eff6ff');
                grad.addColorStop(1, '#fefce8');
                ctx.fillStyle = grad;
                ctx.fillRect(0, 0, W, H);

                // Outer ornate border
                ctx.strokeStyle = '#1e3a8a';
                ctx.lineWidth = 18;
                ctx.strokeRect(26, 26, W - 52, H - 52);

                ctx.strokeStyle = '#facc15';
                ctx.lineWidth = 6;
                ctx.strokeRect(46, 46, W - 92, H - 92);

                // Corner accents
                const corners = [[46, 46], [W - 46, 46], [46, H - 46], [W - 46, H - 46]];
                ctx.fillStyle = '#1e3a8a';
                corners.forEach(([cx, cy]) => {
                    ctx.beginPath();
                    ctx.arc(cx, cy, 18, 0, Math.PI * 2);
                    ctx.fill();
                });

                // Header Ribbon
                ctx.fillStyle = '#1e3a8a';
                ctx.fillRect(260, 82, 680, 52);
                ctx.fillStyle = '#facc15';
                ctx.font = '900 22px Nunito, sans-serif';
                ctx.textAlign = 'center';
                ctx.fillText('DESCRIPTIVE TEXT ADVENTURE • MULTIPLAYER', W / 2, 116);

                // Main Title
                ctx.fillStyle = '#0f172a';
                ctx.font = '900 58px Nunito, sans-serif';
                ctx.fillText('CERTIFICATE OF ACHIEVEMENT', W / 2, 210);

                ctx.fillStyle = '#0284c7';
                ctx.font = '800 24px Nunito, sans-serif';
                ctx.fillText(isTopScorer ? '🏆 FASTEST TOP SCORER CHAMPION 🏆' : '⭐ YOUNG DESCRIPTIVE DETECTIVE ⭐', W / 2, 255);

                // Presented to
                ctx.fillStyle = '#475569';
                ctx.font = '700 22px Nunito, sans-serif';
                ctx.fillText('This certificate is proudly presented to:', W / 2, 320);

                // Student Name
                ctx.fillStyle = '#1e3a8a';
                ctx.font = '900 62px Nunito, sans-serif';
                ctx.fillText(user.name || 'Young Detective', W / 2, 405);

                // Underline
                ctx.strokeStyle = '#facc15';
                ctx.lineWidth = 5;
                ctx.beginPath();
                ctx.moveTo(280, 425);
                ctx.lineTo(W - 280, 425);
                ctx.stroke();

                // Class & Group
                ctx.fillStyle = '#334155';
                ctx.font = '700 22px Nunito, sans-serif';
                const subInfo = [
                    user.class ? `Class: ${user.class}` : 'Grade VII',
                    user.groupName ? `Group: ${user.groupName}` : null,
                    roomCode ? `Room: ${roomCode}` : null
                ].filter(Boolean).join('   •   ');
                ctx.fillText(subInfo, W / 2, 468);

                // Stats Box
                ctx.fillStyle = '#1e3a8a';
                ctx.beginPath();
                ctx.roundRect(180, 505, W - 360, 105, 20);
                ctx.fill();

                ctx.fillStyle = '#facc15';
                ctx.font = '900 32px Nunito, sans-serif';
                ctx.fillText(`RANK #${myRank}   |   LEVEL ${getLevelFromPoints(progress.points)}   |   ${progress.points} PTS   |   ${progress.stars} STARS`, W / 2, 562);

                ctx.fillStyle = '#bae6fd';
                ctx.font = '700 18px Nunito, sans-serif';
                ctx.fillText('For outstanding performance in Describing People, Animals, Things, and Place', W / 2, 594);

                // Footer & Signatures
                const dateStr = new Date().toLocaleDateString('id-ID', { day: 'numeric', month: 'long', year: 'numeric' });

                ctx.textAlign = 'left';
                ctx.fillStyle = '#475569';
                ctx.font = '700 18px Nunito, sans-serif';
                ctx.fillText(`Date: ${dateStr}`, 110, 700);
                ctx.fillText(`Course: ${COURSE_INFO.courseTitle}`, 110, 730);
                ctx.fillText(`Created by: ${COURSE_INFO.groupName}`, 110, 760);

                ctx.textAlign = 'right';
                ctx.fillStyle = '#0f172a';
                ctx.font = '800 20px Nunito, sans-serif';
                ctx.fillText(COURSE_INFO.lecturer, W - 110, 725);
                ctx.fillStyle = '#64748b';
                ctx.font = '700 16px Nunito, sans-serif';
                ctx.fillText('Lecturer / Game Host', W - 110, 752);
            }, [show, user, progress, myRank, isTopScorer, roomCode]);

            if (!show) return null;

            const handleClaimCertificate = async () => {
                setClaimed(true);
                if (roomCode && window.FB_BRIDGE?.available && isTopScorer && !existingWinner) {
                    try {
                        const fb = window.FB_BRIDGE;
                        await fb.setDoc(fb.pubDoc('dta_rooms', roomCode), {
                            certificateWinner: {
                                uid: myUid,
                                name: user.name || 'Student',
                                points: progress.points,
                                claimedAt: Date.now()
                            }
                        }, { merge: true });
                        await fb.addDoc(fb.pubCollection('dta_chat'), {
                            roomCode,
                            senderId: 'system',
                            senderName: 'SYSTEM',
                            senderAvatar: '🏆',
                            role: 'system',
                            text: `🎉 ${user.name} meraih nilai tertinggi (${progress.points} Pts) dan mengklaim Sertifikat Tercepat!`,
                            createdAt: Date.now()
                        });
                    } catch (e) {
                        console.error(e);
                    }
                }
            };

            const downloadPNG = () => {
                if (!canvasRef.current) return;
                const link = document.createElement('a');
                link.download = `Sertifikat_${(user.name || 'Student').replace(/\s+/g, '_')}.png`;
                link.href = canvasRef.current.toDataURL('image/png');
                link.click();
            };

            const downloadPDF = () => {
                if (!canvasRef.current) return;
                if (!window.jspdf || !window.jspdf.jsPDF) {
                    showModal("PDF Library Loading", "Please wait a moment and try downloading PDF again.", "info");
                    return;
                }
                const imgData = canvasRef.current.toDataURL('image/png');
                const { jsPDF } = window.jspdf;
                const pdf = new jsPDF({ orientation: 'landscape', unit: 'px', format: [1200, 850] });
                pdf.addImage(imgData, 'PNG', 0, 0, 1200, 850);
                pdf.save(`Sertifikat_${(user.name || 'Student').replace(/\s+/g, '_')}.pdf`);
            };

            return (
                <div className="fixed inset-0 z-[70] bg-slate-900/85 backdrop-blur-sm flex items-center justify-center p-4 overflow-y-auto">
                    <div className="game-card max-w-3xl w-full p-5 md:p-7 animate-pop my-auto">
                        <div className="flex justify-between items-center mb-4">
                            <div>
                                <h2 className="text-2xl font-black text-brand-deep">🏆 Klaim Sertifikat Juara</h2>
                                <p className="text-xs font-bold text-slate-500">
                                    Peringkat kamu saat ini: <span className="text-brand-deep font-black">#{myRank}</span> ({progress.points} Pts • Level {getLevelFromPoints(progress.points)})
                                </p>
                            </div>
                            <button onClick={onClose} className="btn-3d bg-slate-200 text-slate-700 border-2 border-slate-300 shadow-[0_3px_0_#94a3b8] px-3 py-1.5 text-xs">
                                ✖ Tutup
                            </button>
                        </div>

                        {existingWinner && (
                            <div className="bg-amber-50 border-2 border-amber-300 rounded-xl p-3 mb-4 text-xs font-black text-amber-900 flex items-center justify-between">
                                <span>👑 Pengklaim Sertifikat Tercepat: {existingWinner.name} ({existingWinner.points} Pts)</span>
                                <span>{new Date(existingWinner.claimedAt).toLocaleTimeString()}</span>
                            </div>
                        )}

                        {/* Canvas Preview */}
                        <div className="rounded-2xl overflow-hidden border-4 border-slate-200 shadow-inner mb-5 bg-slate-100">
                            <canvas ref={canvasRef} className="w-full h-auto block" />
                        </div>

                        {!canClaim ? (
                            <div className="bg-blue-50 border-2 border-blue-200 rounded-2xl p-4 text-center">
                                <p className="font-black text-brand-deep text-sm">
                                    Kumpulkan minimal 20 Pts (atau raih Peringkat #1) untuk mengklaim dan mengunduh sertifikatmu!
                                </p>
                            </div>
                        ) : !claimed ? (
                            <button onClick={handleClaimCertificate} className="w-full btn-3d btn-primary py-4 text-lg">
                                🏆 KLAIM SERTIFIKAT SEKARANG {isTopScorer ? '(JUARA #1 TERCEPAT!)' : ''}
                            </button>
                        ) : (
                            <div className="flex flex-col sm:flex-row gap-3">
                                <button onClick={downloadPNG} className="flex-1 btn-3d btn-success py-3.5 text-base">
                                    🖼️ DOWNLOAD PNG
                                </button>
                                <button onClick={downloadPDF} className="flex-1 btn-3d btn-purple py-3.5 text-base">
                                    📄 DOWNLOAD PDF
                                </button>
                            </div>
                        )}
                    </div>
                </div>
            );
        };

        // =========================================================================
        // 7. MAIN APP COMPONENT
        // =========================================================================
        const App = () => {
            const [screen, setScreen] = useState('home');
            const [activeWorld, setActiveWorld] = useState('people');
            const [user, setUser] = useState({ name: '', class: '', groupName: '', members: '', avatar: '🕵️‍♂️', roomCode: '' });
            const [progress, setProgress] = useState({
                points: 0,
                stars: 0,
                completed: []
            });
            const [savedWritings, setSavedWritings] = useState({});
            const [modal, setModal] = useState({ show: false, title: '', message: '', type: 'info', onClose: null });
            const [rewardAnim, setRewardAnim] = useState(null);

            // Multiplayer States
            const [fbReady, setFbReady] = useState(!!window.FB_BRIDGE?.ready);
            const [roomCode, setRoomCode] = useState('');
            const [roomData, setRoomData] = useState(null);
            const [roomPlayers, setRoomPlayers] = useState([]);
            const [roomMessages, setRoomMessages] = useState([]);
            const [voiceMuted, setVoiceMuted] = useState(false);
            const [activeSpeaker, setActiveSpeaker] = useState(null);
            const [showCertModal, setShowCertModal] = useState(false);
            const [isTeacherHost, setIsTeacherHost] = useState(false);

            const lastPlayedVoiceRef = useRef(Date.now());
            const lastBroadcastTaskRef = useRef(0);

            useEffect(() => {
                const onReady = () => setFbReady(true);
                window.addEventListener('fb-ready', onReady);
                if (window.FB_BRIDGE?.ready) setFbReady(true);
                return () => window.removeEventListener('fb-ready', onReady);
            }, []);

            const myUid = window.FB_BRIDGE?.uid || 'local_player';

            const getActivityLabel = (scr, worldId) => {
                if (scr === 'map') return 'Adventure Map';
                if (scr === 'world_hub') return `${WORLDS_DATA[worldId]?.name || ''}`;
                if (scr === 'world_material') return `Reading ${WORLDS_DATA[worldId]?.subjectTitle}`;
                if (scr === 'world_vocab') return `Drag & Drop (${worldId})`;
                if (scr === 'world_grammar') return `Grammar (${worldId})`;
                if (scr === 'world_sentence') return `Sentence (${worldId})`;
                if (scr === 'world_writing') return `Writing (${worldId})`;
                if (scr === 'team_project') return 'Team Project';
                if (scr === 'final_challenge') return 'Final Boss';
                return 'Exploring';
            };

            // Sync current player's profile, points, level, and screen activity to Firestore
            useEffect(() => {
                if (!fbReady || !window.FB_BRIDGE?.available || !roomCode || isTeacherHost || !user.name) return;
                const fb = window.FB_BRIDGE;
                if (!fb.uid) return;

                const syncPlayer = async () => {
                    try {
                        await fb.setDoc(fb.pubDoc('dta_players', `${roomCode}_${fb.uid}`), {
                            uid: fb.uid,
                            roomCode,
                            name: user.name,
                            className: user.class || '',
                            groupName: user.groupName || '',
                            avatar: user.avatar || '🕵️‍♂️',
                            points: progress.points,
                            stars: progress.stars,
                            level: getLevelFromPoints(progress.points),
                            activity: getActivityLabel(screen, activeWorld),
                            updatedAt: Date.now()
                        }, { merge: true });
                    } catch (err) {
                        console.error("Sync player error:", err);
                    }
                };
                syncPlayer();
            }, [fbReady, roomCode, user, progress, screen, activeWorld, isTeacherHost]);

            // Realtime Room, Players, Chat, and Walkie-Talkie Listeners
            useEffect(() => {
                if (!fbReady || !window.FB_BRIDGE?.available || !roomCode) return;
                const fb = window.FB_BRIDGE;
                if (!fb.uid) return;

                // 1. Room state listener (Focus Mode, Live Assigned Task, Certificate Winner)
                const unsubRoom = fb.onSnapshot(
                    fb.pubDoc('dta_rooms', roomCode),
                    (snap) => {
                        if (snap.exists()) {
                            const data = snap.data();
                            setRoomData(data);

                            // If teacher pushes a Live Collaborative Drag & Drop Task, auto-navigate students!
                            if (!isTeacherHost && data.assignedTask && data.assignedTask.timestamp > lastBroadcastTaskRef.current) {
                                lastBroadcastTaskRef.current = data.assignedTask.timestamp;
                                if (data.assignedTask.worldId && data.assignedTask.screen) {
                                    setActiveWorld(data.assignedTask.worldId);
                                    setScreen(data.assignedTask.screen);
                                }
                            }
                        }
                    },
                    (err) => console.error("Room listener error:", err)
                );

                // 2. Players listener (RULE 2: fetch simple collection, filter & sort in JS)
                const unsubPlayers = fb.onSnapshot(
                    fb.pubCollection('dta_players'),
                    (snap) => {
                        const list = [];
                        snap.forEach(d => {
                            const val = d.data();
                            if (val.roomCode === roomCode) list.push(val);
                        });
                        list.sort((a, b) => (b.points || 0) - (a.points || 0));
                        setRoomPlayers(list);
                    },
                    (err) => console.error("Players listener error:", err)
                );

                // 3. Chat listener (filter & sort in JS)
                const unsubChat = fb.onSnapshot(
                    fb.pubCollection('dta_chat'),
                    (snap) => {
                        const msgs = [];
                        snap.forEach(d => {
                            const val = d.data();
                            if (val.roomCode === roomCode) msgs.push({ id: d.id, ...val });
                        });
                        msgs.sort((a, b) => (a.createdAt || 0) - (b.createdAt || 0));
                        setRoomMessages(msgs.slice(-80));
                    },
                    (err) => console.error("Chat listener error:", err)
                );

                // 4. Walkie-Talkie Voice listener
                const unsubVoice = fb.onSnapshot(
                    fb.pubCollection('dta_voice'),
                    (snap) => {
                        const clips = [];
                        snap.forEach(d => {
                            const val = d.data();
                            if (val.roomCode === roomCode && val.createdAt > lastPlayedVoiceRef.current) {
                                clips.push({ id: d.id, ...val });
                            }
                        });
                        if (clips.length > 0) {
                            clips.sort((a, b) => a.createdAt - b.createdAt);
                            const newest = clips[clips.length - 1];
                            lastPlayedVoiceRef.current = newest.createdAt;

                            if (newest.senderId !== fb.uid) {
                                setActiveSpeaker(newest);
                                if (!voiceMuted && newest.audioData) {
                                    try {
                                        const audio = new Audio(newest.audioData);
                                        audio.onended = () => setActiveSpeaker(null);
                                        audio.onerror = () => setActiveSpeaker(null);
                                        audio.play().catch(() => {
                                            setTimeout(() => setActiveSpeaker(null), 3000);
                                        });
                                    } catch (e) {
                                        setTimeout(() => setActiveSpeaker(null), 3000);
                                    }
                                } else {
                                    setTimeout(() => setActiveSpeaker(null), 2500);
                                }
                            }
                        }
                    },
                    (err) => console.error("Voice listener error:", err)
                );

                return () => {
                    unsubRoom();
                    unsubPlayers();
                    unsubChat();
                    unsubVoice();
                };
            }, [fbReady, roomCode, voiceMuted, isTeacherHost]);

            const showModal = (title, message, type = 'info', onClose = null) => {
                setModal({ show: true, title, message, type, onClose });
            };

            const closeModal = () => {
                const cb = modal.onClose;
                setModal({ show: false, title: '', message: '', type: 'info', onClose: null });
                if (cb) cb();
            };

            const addReward = (points, stars, missionId = null) => {
                setProgress(prev => {
                    const alreadyDone = missionId && prev.completed.includes(missionId);
                    const earnedPts = alreadyDone ? 0 : points + (missionId ? 20 : 0);
                    const earnedStars = alreadyDone ? 0 : stars;
                    const newCompleted = (missionId && !alreadyDone) ? [...prev.completed, missionId] : prev.completed;

                    if (earnedPts > 0 || earnedStars > 0) {
                        setRewardAnim({ points: earnedPts, stars: earnedStars });
                        setTimeout(() => setRewardAnim(null), 1800);
                    }

                    return {
                        points: prev.points + earnedPts,
                        stars: prev.stars + earnedStars,
                        completed: newCompleted
                    };
                });
            };

            const saveSession = async (reflectionData) => {
                if (!window.FB_BRIDGE?.available || !window.FB_BRIDGE?.uid) return;
                try {
                    const fb = window.FB_BRIDGE;
                    await fb.addDoc(fb.pubCollection('dta_sessions'), {
                        date: new Date().toISOString(),
                        roomCode: roomCode || 'SOLO',
                        user,
                        progress,
                        writings: savedWritings,
                        reflection: reflectionData
                    });
                } catch (e) {
                    console.error("Save session error:", e);
                }
            };

            const openWorld = (worldId) => {
                setActiveWorld(worldId);
                setScreen('world_hub');
            };

            const hideHeaderScreens = ['home', 'identity', 'credits', 'dashboard'];

            return (
                <div className="min-h-screen flex flex-col font-sans relative pb-20 md:pb-0">
                    {/* Top Navigation Bar (Original Design + Multiplayer Walkie-Talkie & Certificate) */}
                    {!hideHeaderScreens.includes(screen) && (
                        <header className="bg-brand-deep border-b-4 border-blue-950 px-4 py-3 sticky top-0 z-40 text-white shadow-lg flex flex-wrap justify-between items-center gap-3">
                            <div className="flex items-center gap-3">
                                <button
                                    onClick={() => setScreen('map')}
                                    className="bg-blue-800 hover:bg-blue-700 p-2 rounded-xl border-2 border-blue-600 flex items-center justify-center shadow-inner transition relative"
                                    title="Adventure Map"
                                >
                                    <span className="text-2xl">{user.avatar || '🕵️‍♂️'}</span>
                                    <span className="absolute -top-2 -right-2 bg-brand-yellow text-yellow-950 text-[10px] font-black px-1.5 rounded-full border border-white">
                                        Lv.{getLevelFromPoints(progress.points)}
                                    </span>
                                </button>
                                <div>
                                    <div className="font-black text-base md:text-lg leading-tight">{user.name || 'Young Detective'}</div>
                                    <div className="text-brand-sky text-xs font-bold uppercase">
                                        {user.class ? `Class ${user.class}` : 'Grade VII'} {user.groupName ? `• ${user.groupName}` : ''}
                                    </div>
                                </div>
                            </div>

                            <div className="flex items-center gap-2 md:gap-3 flex-wrap">
                                {/* Push-to-Talk Walkie-Talkie */}
                                {roomCode && (
                                    <WalkieTalkieControl
                                        roomCode={roomCode}
                                        senderName={user.name}
                                        senderAvatar={user.avatar}
                                        voiceMuted={voiceMuted}
                                        onToggleMute={() => setVoiceMuted(v => !v)}
                                        activeSpeaker={activeSpeaker}
                                        showModal={showModal}
                                    />
                                )}

                                <div className="flex items-center gap-1.5 bg-slate-800/70 px-3 py-1.5 rounded-full border border-slate-700">
                                    <IconCoin className="w-5 h-5" />
                                    <span className="font-black text-brand-yellow text-base">{progress.points}</span>
                                </div>
                                <div className="flex items-center gap-1.5 bg-slate-800/70 px-3 py-1.5 rounded-full border border-slate-700">
                                    <IconStar className="w-5 h-5 text-brand-orange" />
                                    <span className="font-black text-brand-orange text-base">{progress.stars}</span>
                                </div>
                                <button onClick={() => setShowCertModal(true)} className="hidden sm:flex btn-3d btn-primary px-3 py-1.5 text-xs rounded-lg">
                                    🏆 Sertifikat
                                </button>
                                <button onClick={() => setScreen('map')} className="hidden sm:flex btn-3d btn-secondary px-3 py-1.5 text-xs rounded-lg">
                                    🗺️ Map
                                </button>
                                <button onClick={() => setScreen('credits')} className="hidden md:flex btn-3d bg-slate-700 text-white border-2 border-slate-500 shadow-[0_4px_0_#334155] px-3 py-1.5 text-xs rounded-lg">
                                    🎓 Info
                                </button>
                            </div>
                        </header>
                    )}

                    {/* Live Multiplayer Avatar Bar (Shows Level & Points above each player's head) */}
                    {!hideHeaderScreens.includes(screen) && roomCode && (
                        <MultiplayerAvatarStrip
                            players={roomPlayers}
                            myUid={myUid}
                            activeSpeaker={activeSpeaker}
                            roomCode={roomCode}
                            onOpenCertificate={() => setShowCertModal(true)}
                        />
                    )}

                    {/* Focus Mode Lock Overlay for Students */}
                    {!isTeacherHost && !['home', 'identity', 'dashboard'].includes(screen) && (
                        <FocusModeOverlay
                            roomData={roomData}
                            activeSpeaker={activeSpeaker}
                            voiceMuted={voiceMuted}
                            onToggleMute={() => setVoiceMuted(v => !v)}
                        />
                    )}

                    {/* Minimizable Daftar Murid & Kolom Chat Panels */}
                    {roomCode && !['home', 'identity'].includes(screen) && (
                        <MultiplayerMinimizablePanels
                            roomCode={roomCode}
                            players={roomPlayers}
                            messages={roomMessages}
                            myUid={myUid}
                            myName={isTeacherHost ? 'Guru (Host)' : user.name}
                            myAvatar={isTeacherHost ? '👩‍🏫' : user.avatar}
                            isTeacher={isTeacherHost}
                            activeSpeaker={activeSpeaker}
                        />
                    )}

                    {/* Certificate Claim & Download Modal */}
                    <CertificateModal
                        show={showCertModal}
                        onClose={() => setShowCertModal(false)}
                        user={user}
                        progress={progress}
                        players={roomPlayers}
                        roomCode={roomCode}
                        roomData={roomData}
                        myUid={myUid}
                        showModal={showModal}
                    />

                    {/* Reward Floating Animation */}
                    {rewardAnim && (
                        <div className="fixed inset-0 pointer-events-none z-50 flex items-center justify-center animate-float">
                            <div className="bg-white/95 backdrop-blur-sm p-6 rounded-3xl shadow-2xl border-4 border-brand-yellow text-center star-spin">
                                <div className="text-4xl mb-1">🎉</div>
                                {rewardAnim.points > 0 && <div className="text-2xl font-black text-brand-deep">+{rewardAnim.points} Pts</div>}
                                {rewardAnim.stars > 0 && (
                                    <div className="text-xl font-bold text-brand-orange flex justify-center items-center gap-1">
                                        +{rewardAnim.stars} <IconStar className="w-5 h-5" />
                                    </div>
                                )}
                            </div>
                        </div>
                    )}

                    {/* Global Custom Modal (No alert/confirm) */}
                    {modal.show && (
                        <div className="fixed inset-0 z-[80] flex items-center justify-center bg-slate-900/80 backdrop-blur-sm p-4">
                            <div className="bg-white rounded-3xl p-6 md:p-8 max-w-md w-full shadow-[0_10px_0_#94a3b8] border-4 border-slate-200 animate-pop">
                                <div className="text-center mb-6">
                                    <div className={`inline-flex items-center justify-center w-20 h-20 rounded-full mb-4 ${
                                        modal.type === 'success' ? 'bg-green-100 text-green-600' :
                                        modal.type === 'error' ? 'bg-red-100 text-red-600' : 'bg-blue-100 text-blue-600'
                                    }`}>
                                        <span className="text-4xl">{modal.type === 'success' ? '✨' : modal.type === 'error' ? '❌' : '💡'}</span>
                                    </div>
                                    <h2 className={`text-2xl font-black ${
                                        modal.type === 'success' ? 'text-green-600' :
                                        modal.type === 'error' ? 'text-red-600' : 'text-brand-deep'
                                    }`}>
                                        {modal.title}
                                    </h2>
                                    <p className="text-slate-600 font-semibold mt-2 text-base whitespace-pre-line">{modal.message}</p>
                                </div>
                                <button
                                    onClick={closeModal}
                                    className={`w-full btn-3d py-3 text-lg ${
                                        modal.type === 'success' ? 'btn-success' :
                                        modal.type === 'error' ? 'btn-danger' : 'btn-primary'
                                    }`}
                                >
                                    Continue
                                </button>
                            </div>
                        </div>
                    )}

                    {/* Main Screen Router */}
                    <main className="flex-grow flex flex-col relative z-10">
                        {screen === 'home' && (
                            <ScreenHome
                                onStart={() => { setIsTeacherHost(false); setScreen('identity'); }}
                                onTeacher={() => { setIsTeacherHost(true); setScreen('dashboard'); }}
                            />
                        )}
                        {screen === 'identity' && (
                            <ScreenIdentity
                                showModal={showModal}
                                onComplete={(data) => {
                                    setUser(data);
                                    if (data.roomCode) {
                                        setRoomCode(data.roomCode.trim().toUpperCase());
                                    }
                                    setScreen('credits');
                                }}
                            />
                        )}
                        {screen === 'credits' && (
                            <ScreenCredits
                                user={user}
                                roomCode={roomCode}
                                onNext={() => setScreen('howtoplay')}
                            />
                        )}
                        {screen === 'howtoplay' && <ScreenHowToPlay onNext={() => setScreen('objectives')} />}
                        {screen === 'objectives' && <ScreenObjectives onNext={() => setScreen('map')} />}
                        {screen === 'map' && (
                            <ScreenMap
                                progress={progress}
                                onSelect={(s) => setScreen(s)}
                                onOpenWorld={openWorld}
                            />
                        )}

                        {/* Base Camp Materials */}
                        {screen === 'mat_def' && (
                            <ScreenMaterial
                                data={MATERIAL_CONTENT.def}
                                onBack={() => setScreen('map')}
                                onComplete={() => { addReward(10, 1, 'mat_def'); setScreen('map'); }}
                            />
                        )}
                        {screen === 'mat_struct' && (
                            <ScreenStructure
                                data={MATERIAL_CONTENT.structure}
                                onBack={() => setScreen('map')}
                                onComplete={() => { addReward(10, 1, 'mat_struct'); setScreen('map'); }}
                            />
                        )}
                        {screen === 'mat_lang' && (
                            <ScreenLangFeatures
                                data={MATERIAL_CONTENT.lang}
                                onBack={() => setScreen('map')}
                                onComplete={() => { addReward(10, 1, 'mat_lang'); setScreen('map'); }}
                            />
                        )}

                        {/* Thematic World Hub & 5 Topic-Aligned Stages */}
                        {screen === 'world_hub' && (
                            <ScreenWorldHub
                                world={WORLDS_DATA[activeWorld]}
                                progress={progress}
                                onBack={() => setScreen('map')}
                                onSelectStage={(stage) => setScreen(`world_${stage}`)}
                            />
                        )}
                        {screen === 'world_material' && (
                            <ScreenTopicMaterial
                                world={WORLDS_DATA[activeWorld]}
                                onBack={() => setScreen('world_hub')}
                                onComplete={() => {
                                    addReward(20, 1, `${activeWorld}_material`);
                                    setScreen('world_vocab');
                                }}
                            />
                        )}
                        {screen === 'world_vocab' && (
                            <ScreenDragDropSorter
                                world={WORLDS_DATA[activeWorld]}
                                roomCode={roomCode}
                                userName={user.name || 'Student'}
                                showModal={showModal}
                                onBack={() => setScreen('world_hub')}
                                onComplete={() => {
                                    addReward(40, 1, `${activeWorld}_vocab`);
                                    setScreen('world_grammar');
                                }}
                            />
                        )}
                        {screen === 'world_grammar' && (
                            <ScreenGrammar
                                data={WORLDS_DATA[activeWorld].grammar}
                                title={`${WORLDS_DATA[activeWorld].name}: Grammar Detective`}
                                world={WORLDS_DATA[activeWorld]}
                                showModal={showModal}
                                onBack={() => setScreen('world_hub')}
                                onComplete={() => {
                                    addReward(40, 1, `${activeWorld}_grammar`);
                                    setScreen('world_sentence');
                                }}
                            />
                        )}
                        {screen === 'world_sentence' && (
                            <ScreenSentenceBuilder
                                world={WORLDS_DATA[activeWorld]}
                                showModal={showModal}
                                onBack={() => setScreen('world_hub')}
                                onComplete={() => {
                                    addReward(40, 1, `${activeWorld}_sentence`);
                                    setScreen('world_writing');
                                }}
                            />
                        )}
                        {screen === 'world_writing' && (
                            <ScreenWritingBuilder
                                world={WORLDS_DATA[activeWorld]}
                                showModal={showModal}
                                onBack={() => setScreen('world_hub')}
                                onSaveWriting={(paragraph) => {
                                    setSavedWritings(prev => ({ ...prev, [activeWorld]: paragraph }));
                                }}
                                onComplete={() => {
                                    addReward(50, 2, `${activeWorld}_writing`);
                                    setScreen('world_hub');
                                }}
                            />
                        )}

                        {/* Collaborative Project & Final Boss */}
                        {screen === 'team_project' && (
                            <ScreenTeamProject
                                user={user}
                                roomCode={roomCode}
                                showModal={showModal}
                                onBack={() => setScreen('map')}
                                onComplete={(pts) => {
                                    addReward(pts, 2, 'team_project');
                                    setScreen('map');
                                }}
                            />
                        )}
                        {screen === 'final_challenge' && (
                            <ScreenGrammar
                                data={FINAL_CHALLENGE}
                                title="THE FINAL DESCRIPTIVE CHALLENGE"
                                isFinal={true}
                                showModal={showModal}
                                onBack={() => setScreen('map')}
                                onComplete={() => {
                                    addReward(100, 3, 'final_challenge');
                                    setScreen('reflection');
                                }}
                            />
                        )}
                        {screen === 'reflection' && (
                            <ScreenReflection
                                onComplete={(reflData) => {
                                    saveSession(reflData);
                                    setScreen('achievements');
                                }}
                            />
                        )}
                        {screen === 'achievements' && (
                            <ScreenAchievements
                                progress={progress}
                                user={user}
                                onOpenCertificate={() => setShowCertModal(true)}
                                onRestart={() => window.location.reload()}
                            />
                        )}
                        {screen === 'dashboard' && (
                            <ScreenTeacherDashboard
                                fbReady={fbReady}
                                roomCode={roomCode}
                                setRoomCode={setRoomCode}
                                roomData={roomData}
                                roomPlayers={roomPlayers}
                                voiceMuted={voiceMuted}
                                onToggleMute={() => setVoiceMuted(v => !v)}
                                activeSpeaker={activeSpeaker}
                                showModal={showModal}
                                onBack={() => { setIsTeacherHost(false); setScreen('home'); }}
                            />
                        )}
                    </main>

                    {/* Mobile Bottom Bar */}
                    {!hideHeaderScreens.includes(screen) && screen !== 'achievements' && (
                        <div className="md:hidden fixed bottom-0 left-0 right-0 bg-brand-deep border-t-4 border-blue-950 px-4 py-2 flex justify-around z-40">
                            <button onClick={() => setScreen('map')} className="text-white flex flex-col items-center">
                                <span className="text-xl">🗺️</span>
                                <span className="text-[11px] font-bold">Map</span>
                            </button>
                            <button onClick={() => setShowCertModal(true)} className="text-brand-yellow flex flex-col items-center">
                                <span className="text-xl">🏆</span>
                                <span className="text-[11px] font-bold">Sertifikat</span>
                            </button>
                            <button onClick={() => setScreen('team_project')} className="text-white flex flex-col items-center">
                                <span className="text-xl">🤝</span>
                                <span className="text-[11px] font-bold">Team</span>
                            </button>
                        </div>
                    )}
                </div>
            );
        };

        // =========================================================================
        // 8. HOME, LOGIN & POST-LOGIN CREDITS SCREENS
